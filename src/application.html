<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chrona — Application</title>
    <style>
      :root { font-family: "Segoe UI", system-ui, sans-serif; color: #202124; background: #f7f8fa; }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 28px; }
      .page { max-width: 820px; margin: auto; }
      .top { display: flex; align-items: center; gap: 14px; }
      .back { width: auto; margin: 0; padding: 8px 12px; background: white; color: #111827; border: 1px solid #e5e7eb; border-radius: 9px; cursor: pointer; }
      h1 { margin: 0; font-size: 26px; font-weight: 650; }
      .subtitle { color: #6b7280; margin-top: 5px; font-size: 13px; }
      .section { margin-top: 22px; padding: 20px; background: white; border: 1px solid #e5e7eb; border-radius: 16px; }
      .section h2 { margin: 0; font-size: 16px; }
      .section-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
      .section-subtitle { margin-top: 5px; color: #6b7280; font-size: 12px; }
      select { border: 1px solid #e5e7eb; border-radius: 9px; padding: 8px 10px; background: white; color: #111827; font: inherit; }
      .timeline { position: relative; height: 92px; margin-top: 28px; border-bottom: 2px solid #111827; border-left: 2px solid #111827; overflow: hidden; background: #fff; }
      .timeline-grid { position: absolute; inset: 0; background-image: repeating-linear-gradient(to right, transparent 0, transparent calc(20% - 1px), #eef0f3 calc(20% - 1px), #eef0f3 20%); pointer-events: none; }
      .timeline-track { position: absolute; left: 0; right: 0; top: 31px; height: 25px; }
      .timeline-segment { position: absolute; top: 0; height: 25px; min-width: 2px; border-radius: 4px; background: #a8e617; box-shadow: inset 0 0 0 1px rgba(0,0,0,.05); }
      .timeline-segment::before, .timeline-segment::after { content: ""; position: absolute; top: 5px; width: 5px; height: 15px; background: #111827; border-radius: 1px; }
      .timeline-segment::before { left: 0; }
      .timeline-segment::after { right: 0; }
      .timeline-labels { display: flex; justify-content: space-between; padding: 7px 0 0; font-size: 11px; font-weight: 600; color: #6b7280; }
      .session-list { margin-top: 16px; display: grid; gap: 8px; }
      .session { display: flex; justify-content: space-between; gap: 12px; padding: 9px 10px; background: #f8fafc; border-radius: 9px; font-size: 12px; }
      .session-time { font-weight: 600; color: #111827; }
      .session-duration { color: #6b7280; }

      .summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 16px; }
      .card { padding: 15px; border: 1px solid #e5e7eb; border-radius: 12px; }
      .card small { display: block; color: #6b7280; margin-bottom: 7px; }
      .card strong { font-size: 21px; }
      .chart { margin-top: 20px; display: flex; align-items: flex-end; gap: 7px; height: 230px; overflow-x: auto; padding-bottom: 2px; }
      .bar-item { flex: 1 0 42px; min-width: 42px; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 6px; }
      .bar-value { font-size: 9px; color: #6b7280; min-height: 12px; }
      .bar-wrap { height: 170px; width: 100%; display: flex; align-items: flex-end; justify-content: center; }
      .bar { width: min(28px, 70%); min-height: 3px; border-radius: 6px 6px 2px 2px; background: #4f46e5; }
      .date { font-size: 10px; color: #6b7280; white-space: nowrap; }
      .analytics { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 16px; }
      .analytics .card strong { font-size: 18px; }
      .note { margin-top: 14px; color: #9ca3af; font-size: 11px; }
      .empty { color: #9ca3af; text-align: center; padding: 40px 10px; }
      @media (max-width: 650px) { .summary, .analytics { grid-template-columns: 1fr; } body { padding: 18px; } }
    </style>
  </head>
  <body>
    <main class="page">
      <div class="top">
        <button class="back" id="back" type="button">← Back</button>
        <div>
          <h1 id="title">Application</h1>
          <div class="subtitle">Usage analytics for the last 30 days</div>
        </div>
      </div>

      <section class="section">
        <h2>Usage</h2>
        <div class="summary">
          <div class="card"><small>Total usage</small><strong id="total">0h 0m</strong></div>
          <div class="card"><small>Sessions</small><strong id="sessionCount">0</strong></div>
          <div class="card"><small>Active days</small><strong id="activeDays">0</strong></div>
        </div>
        <div id="usageChart" class="chart"></div>
      </section>


      <section class="section">
        <div class="section-head">
          <div>
            <h2>Daily activity</h2>
            <div class="section-subtitle">Highlighted periods show when the application was in use.</div>
          </div>
          <select id="timelineDate" aria-label="Select day"></select>
        </div>

        <div class="timeline" id="timeline">
          <div class="timeline-grid"></div>
          <div class="timeline-track" id="timelineTrack"></div>
        </div>
        <div class="timeline-labels">
          <span>00</span><span>05</span><span>10</span><span>15</span><span>20</span><span>24</span>
        </div>
        <div class="session-list" id="sessionList"></div>
      </section>

      <section class="section">
        <h2>More analytics</h2>
        <div class="analytics">
          <div class="card"><small>Average per active day</small><strong id="average">0m</strong></div>
          <div class="card"><small>Longest day</small><strong id="longest">0m</strong></div>
          <div class="card"><small>Most active day</small><strong id="mostActive">—</strong></div>
          <div class="card"><small>Average sessions/day</small><strong id="sessions">0</strong></div>
        </div>
      </section>
    </main>
    <script src="application.js"></script>
  </body>
</html>
