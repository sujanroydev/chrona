<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chrona</title>
    <style>
      :root {
        font-family: "Segoe UI", system-ui, sans-serif;
        color: #202124;
        background: #f7f8fa;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 28px;
      }
      .app {
        max-width: 520px;
        margin: auto;
      }
      .support-link {
        position: fixed;
        top: 18px;
        right: 18px;
        z-index: 10;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 8px 11px;
        border: 1px solid #e5e7eb;
        border-radius: 9px;
        background: rgba(255, 255, 255, 0.94);
        color: #111827;
        text-decoration: none;
        font-size: 12px;
        font-weight: 600;
        box-shadow: 0 2px 8px rgba(15, 23, 42, 0.05);
        backdrop-filter: blur(8px);
      }
      .support-link:hover {
        background: #f8fafc;
      }
      h1 {
        margin: 0;
        font-size: 26px;
        font-weight: 650;
      }
      .subtitle {
        color: #6b7280;
        margin-top: 5px;
        font-size: 13px;
      }
      .hero {
        margin-top: 24px;
        padding: 30px 20px;
        text-align: center;
        background: white;
        border: 1px solid #e5e7eb;
        border-radius: 18px;
      }
      .time {
        font-size: 52px;
        line-height: 1;
        font-weight: 700;
        letter-spacing: -2px;
      }
      .label {
        margin-top: 10px;
        color: #6b7280;
        font-size: 14px;
      }
      .status {
        margin-top: 16px;
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 7px 11px;
        border-radius: 999px;
        background: #f1f5f9;
        font-size: 12px;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #9ca3af;
      }
      .active .dot {
        background: #22c55e;
      }
      .stats {
        margin-top: 16px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .card {
        background: white;
        border: 1px solid #e5e7eb;
        border-radius: 14px;
        padding: 16px;
      }
      .card small {
        color: #6b7280;
        display: block;
        margin-bottom: 7px;
      }
      .card strong {
        font-size: 20px;
      }
      button {
        width: 100%;
        margin-top: 16px;
        padding: 11px;
        border: 0;
        border-radius: 10px;
        background: #111827;
        color: white;
        font-size: 14px;
        cursor: pointer;
      }
      button:hover {
        opacity: 0.9;
      }
      .secondary {
        background: white;
        color: #111827;
        border: 1px solid #e5e7eb;
      }
      .analytics {
        margin-top: 16px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .analytics .card {
        background: white;
        border: 1px solid #e5e7eb;
        border-radius: 14px;
        padding: 14px;
      }
      .analytics .card strong {
        font-size: 18px;
      }
      .note {
        text-align: center;
        margin-top: 16px;
        color: #9ca3af;
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <a class="support-link" href="support.html" aria-label="Help and support">
      Help &amp; Support
    </a>

    <main class="app">
      <h1>Chrona</h1>
      <div class="subtitle">Simple activity tracking</div>

      <section class="hero">
        <div id="today" class="time">0h 0m</div>
        <div class="label">Today's screen time</div>
        <div id="status" class="status">
          <span class="dot"></span><span id="statusText">Checking...</span>
        </div>
      </section>

      <section class="stats">
        <div class="card">
          <small>Yesterday</small><strong id="yesterday">0h 0m</strong>
        </div>
        <div class="card">
          <small>Last 7 days</small><strong id="week">0h 0m</strong>
        </div>
      </section>

      <section class="analytics">
        <div class="card">
          <small>Active applications</small>
          <strong id="activeApps">0</strong>
        </div>
        <div class="card">
          <small>Today's sessions</small>
          <strong id="sessions">0</strong>
        </div>
        <div class="card">
          <small>Top application</small>
          <strong id="topApp">—</strong>
        </div>
        <div class="card">
          <small>Top app usage</small>
          <strong id="topAppTime">0m</strong>
        </div>
      </section>

      <button id="usageButton" class="secondary">View usage</button>
      <button id="toggle">Pause tracking</button>
      <div class="note">Runs automatically in the background</div>
    </main>
    <script src="renderer.js"></script>
  </body>
</html>
